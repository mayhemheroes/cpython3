# The Mayhem worker: build the commit image from mayhem/Dockerfile, push it to
# ghcr, then run Mayhem over each Mayhemfile. Runs on manual dispatch and is
# called by sync.yml only when upstream actually moved — we fuzz on real upstream
# movement or an explicit dispatch, NOT on every commit to the mayhem branch.
# Duration defaults to 1200s (20 min); override per dispatch for a longer
# campaign, e.g.:
#   gh workflow run mayhem.yml --ref mayhem -f duration=14400   # 4h
# Needs the MAYHEM_TOKEN secret.
name: Mayhem

on:
  workflow_dispatch:             # manual on-demand run
    inputs:
      duration:
        description: 'Fuzz seconds per target (default 1200 = 20 min; e.g. 14400 = 4h).'
        type: string
        required: false
        default: '1200'
  workflow_call:                 # sync.yml calls this when upstream moved
    inputs:
      ref:
        description: commit/branch to build (cron passes the freshly-rebased mayhem SHA)
        type: string
        required: false
        default: ''
      duration:
        description: fuzz seconds per target
        type: string
        required: false
        default: '1200'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build commit image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full mayhem-branch history in the image (NOT shallow); see SPEC §6.2 item 2
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve build SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=commit-${{ steps.sha.outputs.sha }}

      - name: Build and push (mayhem/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mayhem/Dockerfile
          push: true
          build-args: |
            COMMIT=${{ steps.sha.outputs.sha }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      ref: ${{ steps.sha.outputs.sha }}

  mayhem:
    needs: build
    name: 'fuzz ${{ matrix.mayhemfile }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mayhemfile:
          - mayhem/Mayhemfile_fuzz_builtin_float
          - mayhem/Mayhemfile_fuzz_builtin_int
          - mayhem/Mayhemfile_fuzz_builtin_unicode
          - mayhem/Mayhemfile_fuzz_json_loads
          - mayhem/Mayhemfile_fuzz_sre_compile
          - mayhem/Mayhemfile_fuzz_sre_match
          - mayhem/Mayhemfile_fuzz_csv_reader
          - mayhem/Mayhemfile_fuzz_struct_unpack
          - mayhem/Mayhemfile_fuzz_ast_literal_eval
          - mayhem/Mayhemfile_fuzz_elementtree_parsewhole
          - mayhem/Mayhemfile_fuzz_pycompile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}
      - name: Start analysis for ${{ matrix.mayhemfile }}
        uses: ForAllSecure/mcode-action@v1
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ needs.build.outputs.image }} --file ${{ matrix.mayhemfile }} --duration ${{ inputs.duration || '1200' }}
